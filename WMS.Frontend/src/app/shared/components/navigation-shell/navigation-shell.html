<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer class="sidenav" fixedInViewport mode="side" opened="true">
    <mat-toolbar color="primary" class="brand-title">WMS Portal</mat-toolbar>
    <mat-nav-list>
      <a mat-list-item routerLink="/dashboard" routerLinkActive="active-link">
        <mat-icon matLine>dashboard</mat-icon>
        <span class="nav-text">Dashboard</span>
      </a>
      <a mat-list-item routerLink="/employees" routerLinkActive="active-link">
        <mat-icon matLine>people</mat-icon>
        <span class="nav-text">Employees</span>
      </a>
      <a mat-list-item routerLink="/attendance" routerLinkActive="active-link">
        <mat-icon matLine>access_time</mat-icon>
        <span class="nav-text">Attendance</span>
      </a>
      <a mat-list-item routerLink="/leaves" routerLinkActive="active-link">
        <mat-icon matLine>event_busy</mat-icon>
        <span class="nav-text">Leaves</span>
      </a>
      <a mat-list-item routerLink="/departments" routerLinkActive="active-link">
        <mat-icon matLine>business</mat-icon>
        <span class="nav-text">Departments</span>
      </a>
      <a mat-list-item routerLink="/projects/allocate" routerLinkActive="active-link">
        <mat-icon matLine>assignment_ind</mat-icon>
        <span class="nav-text">Project Allocation</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="main-content">
    <mat-toolbar class="header-toolbar">
      <button type="button" aria-label="Toggle sidenav" mat-icon-button (click)="drawer.toggle()">
        <mat-icon aria-label="Side nav toggle icon">menu</mat-icon>
      </button>
      <span class="spacer"></span>
      <button mat-icon-button class="logout-btn" (click)='onLogout()' title="Logout">
        <mat-icon>exit_to_app</mat-icon>
      </button>
    </mat-toolbar>

    <div class="page-view-wrapper">
      <ng-content></ng-content>
    </div>
  </mat-sidenav-content>
</mat-sidenav-container>
