<app-navigation-shell>
  <div class="header-action-row">
    <h2>Employee Roster Management</h2>
    <button mat-raised-button color="primary" (click)="openAddEmployeeDialog()" *ngIf="isAdmin || isManager">
      <mat-icon>person_add</mat-icon> ADD NEW EMPLOYEE
    </button>
  </div>

  <mat-card class="filter-card">
    <mat-card-content class="filter-grid">
      <mat-form-field appearance="outline">
        <mat-label>Search by Name</mat-label>
        <input matInput [(ngModel)]="searchName" (keyup.enter)="onSearch()" placeholder="Type a name...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <div class="action-buttons">
        <button mat-flat-button color="accent" (click)="onSearch()">FILTER</button>
        <button mat-stroked-button (click)="onClear()">RESET</button>
      </div>
    </mat-card-content>
  </mat-card>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z2 roster-table">
    
    <ng-container matColumnDef="employeeId">
      <th mat-header-cell *matHeaderCellDef> ID </th>
      <td mat-cell *matCellDef="let element"> #{{element.employeeId}} </td>
    </ng-container>

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Employee Name </th>
      <td mat-cell *matCellDef="let element"> {{element.firstName}} {{element.lastName}} </td>
    </ng-container>

    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef> Official Email </th>
      <td mat-cell *matCellDef="let element"> {{element.email}} </td>
    </ng-container>

    <ng-container matColumnDef="phoneNumber">
      <th mat-header-cell *matHeaderCellDef> Contact Number </th>
      <td mat-cell *matCellDef="let element"> {{element.phoneNumber}} </td>
    </ng-container>

    <ng-container matColumnDef="status">
      <th mat-header-cell *matHeaderCellDef> Status </th>
      <td mat-cell *matCellDef="let element">
        <span class="status-pill" [ngClass]="element.status.toLowerCase()">
          {{element.status}}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef> Actions </th>
      <td mat-cell *matCellDef="let element">
        <button mat-icon-button color="primary" *ngIf="isAdmin || (isManager && element.roleId === 3)" (click)="openAddEmployeeDialog(element)" title="Edit Profile">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</app-navigation-shell>
